name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputDirectory=target/locked-dependencies -DoutputType=json -DoutputFile=target/dependency-tree.json
      - run: python scripts/verify-dependencies.py
      - run: bash scripts/security-scan.sh target/dependencies.cdx.json
